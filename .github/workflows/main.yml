name: Deploy to IONOS using WinSCP

on:
  push:
    branches:
      - main  # Trigger the workflow on push to the main branch

jobs:
  deploy:
    runs-on: windows-latest  # Use the latest Windows runner

    steps:
    - name: Checkout code
      uses: actions/checkout@v2  # Checkout the repository code

    - name: Install WinSCP
      run: choco install winscp -y  # Install WinSCP using Chocolatey

    - name: Deploy to IONOS
      env:
        SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
        SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
        SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        LOCAL_DIR: .\
        REMOTE_DIR: /
      run: |
        $winscpCommand = @"
        open sftp://$env:SFTP_USERNAME:$env:SFTP_PASSWORD@$env:SFTP_SERVER/ -hostkey=""
        put $env:LOCAL_DIR $env:REMOTE_DIR
        exit
        "@
        $winscpCommand | Out-File -FilePath winscp-script.txt
        & "C:\Program Files (x86)\WinSCP\WinSCP.com" /script=winscp-script.txt
