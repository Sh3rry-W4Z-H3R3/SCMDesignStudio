<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Services</title>
    <link rel="stylesheet" href="../Stylesheets/stylesheetA.css" />
    <link rel="script" href="../SourceCode/script.js" />
  </head>
  <body>
    <!--START- NAVBAR - Applied site wide -->

    <button
      id="open-sidebar-btn"
      onclick="openSidebar()"
      aria-label="open Sidebar"
      aria-expanded="false"
      aria-controls="navbar"
    >
      <svg
        width="20"
        height="10"
        viewBox="0 0 20 10"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <line y1="1" x2="20" y2="1" stroke="#21100B" stroke-width="2" />
        <line y1="5" x2="20" y2="5" stroke="#21100B" stroke-width="2" />
        <line y1="9" x2="20" y2="9" stroke="#21100B" stroke-width="2" />
      </svg>
    </button>
    <nav class="NavBar" id="navbar">
      <!-- Fix logo and NavBtn Alignment -->
      <div class="logo">
        <span>
          <a href="../SourceCode/index.html">
            <img
              class="SCM-FullLogo-Header"
              src="../Assets/SCM_FullLogo.png"
              alt="."
            /> </a
        ></span>
      </div>

      <ul class="NavBarNav">
        <li>
          <button
            id="close-sidebar-btn"
            onclick="closeSidebar()"
            aria-label="close sidebar"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 18 18"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M1.71973 16.2793L16.2796 1.71943"
                stroke="#21100B"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M16.2803 16.2793L1.7204 1.71943"
                stroke="#21100B"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </li>
        <li class="NavItem">
          <button class="NavBtn">
            <a class="Nav-Link" state="active" href="Index.html">Home</a>
          </button>
        </li>
        <li>
          <button class="NavBtn">
            <a class="Nav-Link" href="About.html">About</a>
          </button>
        </li>

        <li>
          <button class="NavBtn">
            <a class="Nav-Link" href="Process.html">Services</a>
          </button>
        </li>
        <li>
          <button class="NavBtn">
            <a class="Nav-Link" href="Gallery.html">Projects</a>
          </button>
        </li>
        <li>
          <button class="NavBtn">
            <a class="Nav-Link" href="Contact.html">Contact</a>
          </button>
        </li>
        <li>
          <button class="NavBtn">
            <a class="Nav-Link" href="#shop">Shop</a>
          </button>
        </li>
      </ul>
    </nav>

    <!-- END- NAVBAR- Applied sitewide -->
    <!-- Close button for overlay -->
    <div id="overlay" onclick="closeSidebar()" aria-hidden="true"></div>
    <div class="PageWrapper-ServicePage">
      <section class="Service-Page-Sec-1"></section>
      <section class="Service-Page-Sec-2"></section>
      <section class="Service-Page-Sec-3"></section>
      <section class="Service-Page-Sec-4"></section>
      <section class="Service-Page-Sec-5"></section>
      <section class="Service-Page-Sec-6"></section>
    </div>
    <footer></footer>

</html>
